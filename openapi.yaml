openapi: 3.0.3
info:
  title: Task API
  version: 1.0.0
  description: OpenAPI specification for a task management API.
paths:
  /tasks:
    get:
      summary: List tasks
      responses:
        '200':
          description: A list of tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
              example:
                - id: 1
                  title: Buy groceries
                  description: Milk, bread, and eggs
                  completed: false
                - id: 2
                  title: Read a book
                  completed: true
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
            example:
              title: Buy groceries
              description: Milk, bread, and eggs
              completed: false
      responses:
        '201':
          description: The task was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 1
                title: Buy groceries
                description: Milk, bread, and eggs
                completed: false
  /tasks/{id}:
    get:
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Task identifier.
          schema:
            $ref: '#/components/schemas/Task/properties/id'
      responses:
        '200':
          description: The requested task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 1
                title: Buy groceries
                description: Milk, bread, and eggs
                completed: false
        '404':
          description: Task not found.
    put:
      summary: Replace a task
      description: >-
        Replaces the editable fields of a task. PUT is chosen over PATCH because
        the request body uses TaskInput, which requires the task title; a
        partial update that changes other fields without sending the title
        would need a different request schema.
      parameters:
        - name: id
          in: path
          required: true
          description: Task identifier.
          schema:
            $ref: '#/components/schemas/Task/properties/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
            example:
              title: Buy groceries
              description: Milk, bread, and eggs
              completed: true
      responses:
        '200':
          description: The task was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 1
                title: Buy groceries
                description: Milk, bread, and eggs
                completed: true
        '404':
          description: Task not found.
    delete:
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          description: Task identifier.
          schema:
            $ref: '#/components/schemas/Task/properties/id'
      responses:
        '204':
          description: The task was deleted.
        '404':
          description: Task not found.
components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: integer
          description: Unique identifier generated by the server.
        title:
          type: string
          description: Task title.
        description:
          type: string
          description: Optional task description.
        completed:
          type: boolean
          description: Whether the task is completed.
          default: false
    TaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Task title.
        description:
          type: string
          description: Optional task description.
        completed:
          type: boolean
          description: Whether the task is completed; defaults to false.
          default: false
