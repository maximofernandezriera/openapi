openapi: 3.0.3
info:
  title: Task API
  version: 1.0.0
  description: OpenAPI specification for a task management API.
paths: {}
components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: integer
          description: Unique identifier generated by the server.
        title:
          type: string
          description: Task title.
        description:
          type: string
          description: Optional task description.
        completed:
          type: boolean
          description: Whether the task is completed.
          default: false
    TaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Task title.
        description:
          type: string
          description: Optional task description.
        completed:
          type: boolean
          description: Whether the task is completed; defaults to false.
          default: false
